<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Baba, Please 🥹</title><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet"><style>:root{--bg:#10121c;--text:#f7f3eb;--sub:#babacb;--accent:#bab2ff;--note:#fff0a9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:500 16px 'DM Sans',sans-serif;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 35%,#34335b66,transparent 55%),radial-gradient(#ffffff0e 1px,transparent 1px);background-size:auto,26px 26px}.shell{position:relative;min-height:100svh;display:flex;flex-direction:column;padding:26px clamp(18px,5vw,70px)}header,footer{display:flex;align-items:center;justify-content:space-between;gap:18px;font-size:11px;font-weight:700;letter-spacing:.16em;color:#c6c2d4}header b{color:var(--accent)}footer{margin-top:auto;padding-top:38px;color:#85859c}main{flex:1;display:grid;place-items:center}.panel{width:min(760px,100%);text-align:center;animation:enter .45s ease}.eyebrow{font-size:11px;letter-spacing:.25em;font-weight:700;color:var(--accent);text-transform:uppercase}.display{font:600 clamp(55px,11vw,115px)/.99 'Fraunces',serif;letter-spacing:-.065em;margin:18px 0 22px}.display em{color:var(--accent);font-weight:600}.copy{color:#cac7d4;font-size:clamp(17px,2.4vw,21px);line-height:1.6;max-width:610px;margin:0 auto 30px}.note{position:relative;background:var(--note);color:#332c21;padding:35px 40px 27px;margin:35px auto;max-width:485px;box-shadow:5px 12px 0 #0002,0 28px 65px #0005;transform:rotate(-2deg)}.note:before{content:'';position:absolute;width:110px;height:31px;top:-14px;left:calc(50% - 55px);transform:rotate(4deg);background:#f2d8b599}.note p{font:700 clamp(27px,4vw,39px)/1.15 'Caveat',cursive;margin:0}.note span{display:block;text-align:right;font:700 24px 'Caveat',cursive;margin-top:20px}.actions{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:15px;min-height:100px}.btn{border:0;border-radius:100px;padding:18px 30px;cursor:pointer;font:700 13px 'DM Sans',sans-serif;letter-spacing:.05em;transition:transform .22s,box-shadow .22s}.btn:hover{box-shadow:0 10px 30px #0004}.primary{background:var(--accent);color:#161427}.muted{background:#353444;color:#f6f2fd}.outline{background:transparent;color:#f8f6ff;border:1px solid #ffffff66}.sub{font-size:12px;color:#a4a1b4;line-height:1.6}.progress{display:flex;justify-content:space-between;gap:15px;color:#bdb9d3;font-size:11px;letter-spacing:.15em;border-bottom:1px solid #ffffff29;padding-bottom:16px;margin-bottom:28px}.quiz{max-width:640px;margin:0 auto;text-align:left}.quiz .display{font-size:clamp(36px,6vw,58px);letter-spacing:-.045em;line-height:1.15}.choice{border:1px solid #59566f;background:#242536;color:#f4f1f9;padding:18px 20px;border-radius:15px;display:flex;gap:16px;width:100%;text-align:left;margin:10px 0;align-items:center;font:600 16px 'DM Sans';cursor:pointer}.choice.chosen{border:2px solid #b9b0ff;background:#393658}.choice b{color:#c4baff}.timer{font-size:18px;font-variant-numeric:tabular-nums;color:#dad5f5}.timer.warn{color:#ffb3ae}.bar{height:5px;background:#49465b;border-radius:5px;margin:20px 0 38px}.bar>div{height:100%;background:var(--accent);border-radius:5px;transition:width .3s}.score{font:700 110px 'Fraunces',serif;color:var(--note);margin:5px 0}.answers{text-align:left;max-width:620px;margin:22px auto;max-height:220px;overflow:auto}.answers summary{cursor:pointer}.answers p{color:#c4c1d2}.verdict{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.verdict .link{background:none;color:#b5b2c8;border:0;padding:15px;cursor:pointer;text-decoration:underline}.tiny{font-size:12px;color:#bab4c7;margin:20px auto;max-width:520px}.chip{display:inline-block;border:1px solid #5b586f;padding:9px 12px;border-radius:30px;margin:5px;color:#dcd8e9;font-size:11px;letter-spacing:.06em}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:14px 24px;background:#342e52;border:1px solid #766aa9;border-radius:12px;box-shadow:0 15px 40px #0005;font-size:13px;z-index:20}.easter{font:700 26px 'Caveat',cursive;color:var(--note);margin:12px 0 30px}.spark{position:fixed;top:-30px;pointer-events:none;animation:fall 3s linear forwards;z-index:10}@keyframes fall{to{transform:translateY(110vh) rotate(950deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@media(max-width:520px){.shell{padding:20px 17px}header{font-size:9px}.note{padding:32px 23px 20px}.actions{gap:10px}.btn{padding:15px 23px}.display{font-size:clamp(52px,14vw,76px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><div class="shell"><header><span>✳ <b>A NOTE TO BABA</b></span><span>MADE WITH ♡</span></header><main id="app"></main><footer><span>AN IMPORTANT REQUEST · 2026</span><span>JUST FROM YOUR SON ♡</span></footer></div><script src="config.js"></script><script>
const config=window.BABA_CONFIG||{};
function dbIsReady(){return /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(config.url||'') && /^sb_publishable_[A-Za-z0-9_]+$/.test(config.key||'')}
async function saveOnline(data){
 if(!dbIsReady())throw new Error('Online database is not configured');
 const response=await fetch(config.url+'/rest/v1/baba_results',{
   method:'POST',headers:{'apikey':config.key,'Content-Type':'application/json','Prefer':'return=minimal'},
   body:JSON.stringify(Object.assign({session_id:sid},data))
 });
 if(!response.ok)throw new Error('Remote database returned HTTP '+response.status);
 return true;
}
const reasons=[['I worked really hard for this.','Baba, I have been preparing and building for weeks. This matters so much to me.'],['My team is counting on me.','We did this together, and I want to be there to present what we created.'],['It is a real national competition.','It is a chance to represent my school, learn, and make everyone proud.'],['I know about the 9/25.','I am not ignoring that grade. I know it was bad, and I know school matters.'],['I will take my studies seriously.','I will make a real catch-up plan for the lessons I miss and do my revision.'],['I love making things.','This competition is exactly the kind of work I feel excited and motivated to do.'],['Just please, Baba. 🥹','I am not asking you to forget about my marks. I am asking you to see how hard I worked on this.']];
const qs=[['12 C of charge passes through a wire in 3 s. Calculate the current.',['4 A','36 A','0.25 A','15 A'],0,'Current = charge ÷ time = 12 ÷ 3 = 4 A.'],['Two resistors, 4 Ω and 6 Ω, are connected in series. Total resistance?',['2 Ω','10 Ω','24 Ω','1.5 Ω'],1,'Series resistances add: 4 + 6 = 10 Ω.'],['A 6 Ω resistor carries 2 A. Find the potential difference.',['3 V','8 V','12 V','4 V'],2,'V = IR = 2 × 6 = 12 V.'],['Which quantity is identical at all points in a series circuit?',['Current','Voltage','Resistance','Power'],0,'The current is the same at every point in a series circuit.'],['A 12 V device takes 3 A. Calculate its power.',['4 W','15 W','9 W','36 W'],3,'P = VI = 12 × 3 = 36 W.']];
let stage='intro',idx=0,dodges=0,q=0,answers=[],remaining=300,interval=null,verdict='',score=0;const el=document.getElementById('app');let sid=crypto.randomUUID();function b(label,cls,action,extra=''){return `<button class="btn ${cls}" onclick="${action}" ${extra}>${label}</button>`}function view(html){el.innerHTML=`<section class="panel">${html}</section>`}function head(tag,title,copy){return `<div class="eyebrow">${tag}</div><h1 class="display">${title}</h1><p class="copy">${copy}</p>`}function render(){if(stage==='intro')view(head('A very important message','Baba, <em>please.</em>','Before you write NO and 9/25 again… I made you a little something. Please hear me out. 🥹')+`<div class="note"><p>dear baba,<br>pretty please? ♡</p><span>— your son</span></div>${b('ENTER PRESENTATION ↗','primary','start()')}<p class="tiny">Opens in fullscreen if your browser allows it. You may exit at any time.</p>`);if(stage==='reasons'){let r=reasons[idx];view(`<div class="progress"><span>01 — MY REASONS</span><span>${idx+1} / ${reasons.length}</span></div>`+head('Exhibit '+(idx+1),r[0],'<span class="chip">ANOTHER REASON TO SAY YES</span>')+`<div class="note"><p>${r[1]}</p><span>— your son ♡</span></div><div class="actions">${b(idx===reasons.length-1?'I HEAR YOU · NEXT →':'NEXT REASON →','primary','next()')}<button id="no" class="btn muted" onclick="dodge()" onpointerenter="dodge()">${dodges>2?'STILL NO? 😭':'NO'}</button></div><p class="tiny">The “no” button is shy. You can still give a real answer at the end.</p>`)}if(stage==='quizintro')view(head('02 — A MINI CHALLENGE','Your turn, <em>Baba.</em>','Since you brought up my 9/25… here are five IGCSE-style Physics electricity questions. Let’s see how you do. ⚡')+`<div><span class="chip">5 QUESTIONS</span><span class="chip">5 MINUTES</span><span class="chip">ELECTRICITY</span></div><div style="height:28px"></div>${b('BEGIN ELECTRICITY QUIZ →','primary','beginQuiz()')}<p class="tiny">These are practice questions, not an official Cambridge test. When online saving is connected, this quiz submits your answers, score, time taken, and final verdict so your son can see them. Otherwise results remain in this browser.</p>`);if(stage==='quiz'){const x=qs[q];view(`<div class="quiz"><div class="progress"><span>PHYSICS 0625 · ELECTRICITY</span><span class="timer ${remaining<60?'warn':''}" id="clock">${time(remaining)}</span></div><div class="bar"><div style="width:${100*(q+1)/5}%"></div></div><div class="eyebrow">QUESTION ${q+1} / 5</div><h2 class="display">${x[0]}</h2>${x[1].map((o,i)=>`<button class="choice ${answers[q]===i?'chosen':''}" onclick="selectAnswer(${i})"><b>${'ABCD'[i]}</b> ${o}</button>`).join('')}<div style="height:15px"></div>${b(q===4?'SUBMIT MY TEST':'NEXT QUESTION →','primary','nextQuestion()',answers[q]===undefined?'disabled':'')}</div>`)}if(stage==='result')view(head('TEST COMPLETED','Well played, <em>Baba.</em>','Here is your IGCSE electricity mini-quiz result.')+`<div class="score">${score}<span style="font-size:36px">/5</span></div><details class="answers"><summary>See correct answers and explanations</summary>${qs.map((x,i)=>`<p><b>${i+1}. ${answers[i]===x[2]?'✓':'✗'} ${x[1][x[2]]}</b><br>${x[3]}</p>`).join('')}</details><p class="tiny" id="saveStatus">Saving your results...</p>${b('ONE LAST THING →','primary','showVerdict()')}`);if(stage==='verdict')view(head('03 — THE FINAL STICKY NOTE','Please, <em>Baba.</em>','')+`<div class="note"><p>I beg you. I worked really hard on this. I know my 9/25 was disappointing, and I will work on improving my grades. But I really care about this competition. Please.</p><span>love, your son ♡</span></div><div class="easter">P.S. It’s “dumbass”, not “dumpass” on your note 😭</div><p class="copy" style="margin-bottom:18px">So… what do you think?</p><div class="verdict">${b('YES 🥹','primary',`finish('yes')`)}${b('LET’S DISCUSS','outline',`finish('discuss')`)}<button class="link" onclick="finish('no')">No, for now</button></div><p class="tiny">Your choice is yours. When you select an answer, your quiz score, five answers, time taken and verdict are submitted together to the private database.</p>`);if(stage==='done')view(head('MESSAGE RECEIVED',verdict==='yes'?'THANK YOU, <em>BABA!</em> 🥹':verdict==='discuss'?'I will <em>listen.</em>':'I hear you, <em>Baba.</em>',verdict==='yes'?'I promise to keep my academics a priority.':verdict==='discuss'?'Thank you for listening. I want to understand your concerns.':'Thank you for taking the time to hear me out.')+`<div class="note"><p>Quiz: ${score}/5<br>Verdict: ${verdict.toUpperCase()}</p><span>— thank you for answering ♡</span></div><p class="tiny" id="verdictSave">Saving your answer...</p>${b('RESTART ↻','outline','restart()')}`)}function start(){document.documentElement.requestFullscreen?.().catch(()=>{});stage='reasons';render()}function next(){if(idx<6)idx++;else stage='quizintro';render()}function dodge(){dodges++;const no=document.getElementById('no');if(no){no.style.transform=`translate(${(Math.random()-.5)*95}px,${(Math.random()-.5)*45}px)`;if(dodges%2===0)idx=Math.min(6,idx+1),render()}}function beginQuiz(){q=0;answers=[];remaining=300;stage='quiz';render();if(interval)clearInterval(interval);interval=setInterval(()=>{remaining=Math.max(0,remaining-1);let c=document.getElementById('clock');if(c){c.textContent=time(remaining);c.className='timer '+(remaining<60?'warn':'')}if(remaining===0)quizDone()},1000)}function time(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function selectAnswer(i){answers[q]=i;render()}function nextQuestion(){if(answers[q]===undefined)return;if(q<4){q++;render()}else quizDone()}function quizDone(){
 clearInterval(interval);
 score=qs.reduce((n,x,i)=>n+(answers[i]===x[2]?1:0),0);
 stage='result';render();
 try{localStorage.setItem('babaQuiz',JSON.stringify({id:sid,score,answers,remaining,completedAt:new Date().toISOString()}))}catch(e){}
 const node=document.getElementById('saveStatus');
 if(node)node.textContent='Quiz calculated. Your score, answers and final choice will be saved together when you submit your verdict.';
}
function showVerdict(){stage='verdict';render()}
async function finish(v){
 verdict=v;stage='done';render();
 const node=document.getElementById('verdictSave');
 if(node)node.textContent='Saving your quiz and verdict together…';
 const record={id:sid,score,answers:Array.from({length:5},(_,i)=>Number.isInteger(answers[i])?answers[i]:null),time_seconds:300-remaining,verdict:v,at:new Date().toISOString()};
 try{localStorage.setItem('babaComplete',JSON.stringify(record))}catch(e){}
 if(!dbIsReady()){if(node)node.textContent='⚠ Online database unavailable. Your answer is only stored on this device.';return}
 for(let attempt=0;attempt<2;attempt++){
   try{
    await saveOnline({event_type:'complete',quiz_score:score,time_seconds:300-remaining,answers:record.answers,verdict:v});
    if(node)node.textContent='✓ Quiz score, answers, time and final verdict all saved online successfully.';
    try{localStorage.removeItem('babaComplete')}catch(e){}
    return;
   }catch(err){
    if(attempt===1 && node){
      node.textContent='⚠ Online saving failed. Your answer is saved on this device only. ';
      const retry=document.createElement('button');retry.className='btn outline';retry.textContent='TRY SAVING AGAIN';retry.onclick=()=>savePending();node.appendChild(retry);
    }
   }
 }
}
async function savePending(){
 const node=document.getElementById('verdictSave');
 const raw=localStorage.getItem('babaComplete');if(!raw||!dbIsReady())return;
 const rec=JSON.parse(raw);if(node)node.textContent='Retrying online save…';
 try{await saveOnline({event_type:'complete',quiz_score:rec.score,time_seconds:rec.time_seconds,answers:rec.answers,verdict:rec.verdict});localStorage.removeItem('babaComplete');if(node)node.textContent='✓ Full submission saved online successfully.'}
 catch(e){if(node)node.textContent='⚠ Still unable to save online. Please try again on a stable connection.'}
}
function confetti(){for(let i=0;i<65;i++){const x=document.createElement('span');x.className='spark';x.textContent=['♥','✦','✳','●'][i%4];x.style.left=Math.random()*100+'vw';x.style.fontSize=(13+Math.random()*17)+'px';x.style.color=['#b7afff','#fff0a9','#b1ead4','#ffaac2'][i%4];x.style.animationDelay=Math.random()*1.2+'s';document.body.append(x);setTimeout(()=>x.remove(),4400)}}function restart(){stage='intro';idx=0;dodges=0;answers=[];verdict='';render()}render();</script></body></html>
